spring.application.name=restaurante

# Segredos desta maquina ficam em application-local.properties (ignorado pelo git).
# Modelo: application-local.example.properties. Tambem funcionam as variaveis
# de ambiente DB_URL, DB_USER, DB_PASSWORD e JWT_SECRET.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurante}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:troque-esta-senha}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

# JWT (RN02). Em producao defina a variavel de ambiente JWT_SECRET (minimo 32 caracteres).
# O valor abaixo e publico: serve so para desenvolvimento.
jwt.secret=${JWT_SECRET:segredo-de-desenvolvimento-troque-em-producao-0123456789}
jwt.expiration-minutes=480

# Impressora da cozinha (RF001)
# modo=simulada grava os cupons em impressoes/cupons-simulados.txt (nao precisa de impressora)
# modo=rede envia comandos ESC/POS por TCP para uma impressora termica (Elgin, Bematech etc.)
impressora.modo=simulada
impressora.simulada.pasta=impressoes
impressora.simulada.falhar=false
# usados somente com modo=rede
impressora.host=
impressora.porta=9100
impressora.timeout-ms=3000
# 48 colunas para papel de 80 mm, 32 para papel de 58 mm
impressora.colunas=48
# true funciona em qualquer modelo; false usa a tabela de caracteres abaixo (3 = PC860 portugues na maioria)
impressora.remover-acentos=true
impressora.tabela-caracteres=3
